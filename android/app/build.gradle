plugins { id 'com.android.application' }
def releaseSigning = new Properties()
def releaseSigningDir = rootProject.file('../../NesDQ_signing')
def releaseSigningFile = new File(releaseSigningDir, 'release.properties')
if (releaseSigningFile.exists()) {
 releaseSigningFile.withInputStream { releaseSigning.load(it) }
}
android {
 namespace 'com.nesdq.app'
 compileSdk 35
 ndkVersion '30.0.16248370'
 defaultConfig {
  applicationId 'com.nesdq.app'
  minSdk 23
  targetSdk 35
  versionCode 17
  versionName '1.0.7'
  ndk { abiFilters 'arm64-v8a' }
  externalNativeBuild { cmake {
   arguments '-DANDROID_STL=c++_static'
   if (providers.gradleProperty('sdlSource').isPresent()) {
    arguments '-DFETCHCONTENT_SOURCE_DIR_SDL3='+providers.gradleProperty('sdlSource').get()
   }
   targets 'nesdq'
  } }
 }
 externalNativeBuild { cmake { path file('../../CMakeLists.txt'); version '4.1.2' } }
 signingConfigs {
  if (!releaseSigning.isEmpty()) {
   release {
    storeFile new File(releaseSigningDir, 'nesdq-release.p12')
    storeType 'PKCS12'
    storePassword releaseSigning.getProperty('storePassword')
    keyAlias releaseSigning.getProperty('keyAlias')
    keyPassword releaseSigning.getProperty('keyPassword')
   }
  }
 }
 buildTypes {
  release {
   minifyEnabled false
   if (!releaseSigning.isEmpty()) signingConfig signingConfigs.release
  }
 }
}
tasks.register('requireReleaseSigning') {
 doLast {
  if (releaseSigning.isEmpty()) throw new GradleException('Release signing is missing in ../NesDQ_signing. Unsigned release is disabled.')
 }
}
tasks.configureEach {
 if (name == 'preReleaseBuild') dependsOn('requireReleaseSigning')
}
